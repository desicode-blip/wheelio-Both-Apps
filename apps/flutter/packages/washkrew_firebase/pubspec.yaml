name: washkrew_firebase
description: Shared Firebase backend and prelaunch web experience for WashKrew.
version: 0.1.0
publish_to: none
environment:
  sdk: ^3.10.7
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.0
  firebase_storage: ^13.0.0
  geolocator: ^14.0.2
  razorpay_flutter: ^1.4.7
  firebase_messaging: ^16.1.0
  permission_handler: 12.0.3
  # Keep the Flutter 3.38 / AGP 8 toolchain; newer native versions require AGP 9.
  permission_handler_android: 13.0.1
  path_provider: ^2.1.5
  web: ^1.1.1
  washkrew_ui:
    path: ../washkrew_ui
  google_maps_flutter: 2.13.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
