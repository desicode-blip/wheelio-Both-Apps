name: wheelio_customer
description: Wheelio customer app (iOS first, then Android). One Flutter codebase.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  wheelio_ui:
    path: ../../packages/wheelio_ui
  go_router: ">=14.0.0 <18.0.0"
  google_fonts: ">=6.2.1 <9.0.0"
  intl: ">=0.19.0 <1.0.0"

  # Added when the real services are connected (see docs/CONNECT-LATER.md):
  # supabase_flutter, razorpay_flutter, image_picker, geolocator,
  # google_maps_flutter, firebase_messaging, url_launcher, shared_preferences

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
